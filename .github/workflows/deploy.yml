name: Deploy to Production

on:
  push:
    branches: [main]
    tags: [v*]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    name: Test & Lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci --legacy-peer-deps
      - run: npm run lint
      - run: npm run build
      - run: npm test -- --coverage

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/lcov.info
          flags: unittests
          fail_ci_if_error: false

  security:
    runs-on: ubuntu-latest
    name: Security Audit
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci --legacy-peer-deps
      - run: npm audit --audit-level=moderate || true

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  build-backend:
    needs: [test, security]
    runs-on: ubuntu-latest
    name: Build Backend Docker Images
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [ryzanstein, negative-space, qhss, nexuszero, doppelganger, elite-agents]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./backend/${{ matrix.service }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.service }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    needs: build-backend
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    name: Deploy to Staging
    environment:
      name: staging
      url: https://staging.myceloforge.com
    steps:
      - uses: actions/checkout@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG_STAGING }}" | base64 -d > $HOME/.kube/config

      - name: Deploy with kubectl
        run: |
          kubectl set image deployment/ryzanstein \
            ryzanstein=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/ryzanstein:${{ github.sha }} \
            -n myceloforge-prod || \
          kubectl apply -f k8s/ -n myceloforge-prod

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/ryzanstein \
            -n myceloforge-prod --timeout=5m

      - name: Run smoke tests
        run: npm run test:e2e
        env:
          TEST_URL: https://staging.myceloforge.com

  deploy-production:
    needs: deploy-staging
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    name: Deploy to Production
    environment:
      name: production
      url: https://myceloforge.com
    steps:
      - uses: actions/checkout@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG_PRODUCTION }}" | base64 -d > $HOME/.kube/config

      - name: Blue-Green Deployment
        run: |
          # Create green deployment
          kubectl set image deployment/ryzanstein-green \
            ryzanstein=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/ryzanstein:${{ github.sha }} \
            -n myceloforge-prod || \
          kubectl apply -f k8s/ryzanstein-deployment.yaml -l version=v2 -n myceloforge-prod

          # Wait for green deployment
          kubectl rollout status deployment/ryzanstein-green \
            -n myceloforge-prod --timeout=5m

      - name: Health Check
        run: |
          sleep 30
          curl -f https://myceloforge.com/api/health || exit 1
          curl -f https://myceloforge.com/api/metrics || exit 1

      - name: Switch Traffic (Blue -> Green)
        run: |
          kubectl patch service ryzanstein \
            -n myceloforge-prod \
            -p '{"spec":{"selector":{"version":"v2"}}}'

      - name: Monitor Metrics
        run: |
          echo "Monitoring error rate and latency..."
          for i in {1..60}; do
            curl -s https://myceloforge.com/api/health
            sleep 1
          done

      - name: Rollback on Failure
        if: failure()
        run: |
          echo "Deployment failed, rolling back..."
          kubectl patch service ryzanstein \
            -n myceloforge-prod \
            -p '{"spec":{"selector":{"version":"v1"}}}'

      - name: Notify Deployment
        if: success()
        uses: actions/github-script@v6
        with:
          script: |
            github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.ref,
              environment: 'production',
              description: 'Production deployment',
              auto_merge: false,
              required_contexts: [],
              production_environment: true
            })

  notify:
    needs: [deploy-production]
    if: always()
    runs-on: ubuntu-latest
    name: Notify Team
    steps:
      - name: Post deployment status
        uses: actions/github-script@v6
        with:
          script: |
            const status = '${{ needs.deploy-production.result }}';
            const emoji = status === 'success' ? '✅' : '❌';

            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `${emoji} Production deployment ${status}`
            })
