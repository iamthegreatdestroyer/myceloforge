version: "3.8"
services:
  ryzanstein:
    build: ./backend/ryzanstein
    ports: ["8000:8000"]
    volumes: ["./backend/ryzanstein/models:/app/models"]
    environment:
      - SERVICE_NAME=ryzanstein

  negative-space:
    build: ./backend/negative-space
    ports: ["8001:8001"]
    environment:
      - SERVICE_NAME=negative-space

  qhss:
    build: ./backend/qhss
    ports: ["8002:8002"]
    environment:
      - SERVICE_NAME=qhss

  nexuszero:
    build: ./backend/nexuszero
    ports: ["8003:8003"]
    depends_on:
      - ryzanstein
      - negative-space
      - qhss
    environment:
      - SERVICE_NAME=nexuszero

  doppelganger:
    build: ./backend/doppelganger
    ports: ["8004:8004"]
    environment:
      - SERVICE_NAME=doppelganger

  elite-agents:
    build: ./backend/elite-agents
    ports: ["8005:8005"]
    environment:
      - SERVICE_NAME=elite-agents

  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333"]
    volumes:
      - qdrant-storage:/qdrant/storage

volumes:
  qdrant-storage:
