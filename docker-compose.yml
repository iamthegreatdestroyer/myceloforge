version: "3.8"
services:
  ryzanstein:
    build: ./backend/ryzanstein
    ports: ["24000:8000"]
    volumes: ["./backend/ryzanstein/models:/app/models"]
    environment:
      - SERVICE_NAME=ryzanstein
    networks:
      - myceloforge-net

  negative-space:
    build: ./backend/negative-space
    ports: ["24001:8001"]
    environment:
      - SERVICE_NAME=negative-space
    networks:
      - myceloforge-net

  qhss:
    build: ./backend/qhss
    ports: ["24002:8002"]
    environment:
      - SERVICE_NAME=qhss
    networks:
      - myceloforge-net

  nexuszero:
    build: ./backend/nexuszero
    ports: ["24003:8003"]
    depends_on:
      - ryzanstein
      - negative-space
      - qhss
    environment:
      - SERVICE_NAME=nexuszero
    networks:
      - myceloforge-net

  doppelganger:
    build: ./backend/doppelganger
    ports: ["24004:8004"]
    environment:
      - SERVICE_NAME=doppelganger
    networks:
      - myceloforge-net

  elite-agents:
    build: ./backend/elite-agents
    ports: ["24005:8005"]
    environment:
      - SERVICE_NAME=elite-agents
    networks:
      - myceloforge-net

  qdrant:
    image: qdrant/qdrant:latest
    ports: ["24333:6333"]
    volumes:
      - qdrant-storage:/qdrant/storage
    environment:
      - QDRANT_API_KEY=${QDRANT_API_KEY:-}
    networks:
      - myceloforge-net

  # Phase 10: Observability & Monitoring
  prometheus:
    image: prom/prometheus:latest
    ports: ["24400:9090"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./monitoring/prometheus-rules.yml:/etc/prometheus/rules/prometheus-rules.yml
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    networks:
      - myceloforge-net
    depends_on:
      - ryzanstein
      - negative-space
      - qhss
      - nexuszero
      - doppelganger
      - elite-agents

  grafana:
    image: grafana/grafana:latest
    ports: ["24401:3000"]
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=myceloforge-admin
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    networks:
      - myceloforge-net
    depends_on:
      - prometheus

  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "24402:16686"  # Jaeger UI
      - "6831:6831/udp"  # Jaeger agent
    environment:
      - COLLECTOR_ZIPKIN_HOST_PORT=:9411
    networks:
      - myceloforge-net

volumes:
  qdrant-storage:
  prometheus-data:
  grafana-storage:

networks:
  myceloforge-net:
    driver: bridge
