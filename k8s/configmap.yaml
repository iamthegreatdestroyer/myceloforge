apiVersion: v1
kind: ConfigMap
metadata:
  name: ryzanstein-config
  namespace: myceloforge-prod
data:
  environment: production
  log_level: info
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: observability-config
  namespace: myceloforge-prod
data:
  jaeger-host: "jaeger-collector.observability.svc.cluster.local"
  prometheus-url: "http://prometheus.observability.svc.cluster.local:9090"
  grafana-url: "http://grafana.observability.svc.cluster.local:3000"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: logging-config
  namespace: myceloforge-prod
data:
  log_format: json
  log_level: info
  log_sink_url: "https://logs.myceloforge.com/api/logs"
